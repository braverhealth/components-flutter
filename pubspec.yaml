name: livekit_components
description: "Out-of-the-box flutter widgets for livekit client."
version: 1.3.0
homepage: https://github.com/livekit/components-flutter

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc:
    git:
      url: https://github.com/braverhealth/flutter-webrtc.git
      ref: 9c131c8750c0ac5c320330299f5fea4b596c6346 # v1.3.0 + PiP support
  livekit_client:
    git:
      url: https://github.com/braverhealth/client-sdk-flutter.git
      ref: 283228f0c050f749d593c999874de7aa005b3af6 # v2.6.5 + use Braver flutter_webrtc
  chat_bubbles: ^1.6.0
  collection: ^1.19.0
  flutter_background: ^1.3.0+1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  provider: ^6.1.2
  responsive_builder: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0

topics:
  - webrtc
  - artificial-intelligence
  - livestream
  - conference
  - agent
